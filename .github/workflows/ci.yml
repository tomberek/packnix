name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    # tests.nix's combinator suite plus verify-fixtures.sh's full sweep is
    # well under a minute locally; generous headroom for a cold nix-install.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22

      # tests.nix: standalone combinator suite (cut-operator semantics,
      # star/opt/and/not/regex edge cases). Every attribute is a bool;
      # allPassed must be true.
      - name: Run combinator tests
        run: |
          result=$(nix eval --file tests.nix --json)
          echo "$result" | jq .
          [[ "$(echo "$result" | jq -r .allPassed)" == "true" ]]

      # verify-fixtures.sh: every JSON fixture in data/ and bench/fixtures/
      # must parse byte-identical to builtins.fromJSON through both
      # grammar/json.nix and (where the fixture is flake.lock-shaped)
      # grammar/flakelock.nix. This is the same check this repo's history
      # has done by hand before trusting any benchmark number -- running
      # it in CI means a grammar regression fails the build instead of
      # silently producing wrong values that only benchmarking would
      # happen to notice.
      - name: Verify fixtures parse byte-identical to builtins.fromJSON
        run: ./verify-fixtures.sh

      # verify-json-toml-commit.sh: the { json = {}; }/{ toml = {}; }
      # combinator must throw EAGERLY on malformed input reached from a
      # backtrackable position, not silently let `opt`/`choice` report a
      # bogus success with the error hidden in an unforced thunk.
      - name: Verify json/toml combinator throws eagerly, not lazily
        run: ./verify-json-toml-commit.sh

      # verify-valuewalk-parity.sh: grammar/flakelock.nix (string-position
      # packrat grammar) and examples/flakelock-valuewalk.nix (lib/
      # valuewalk.nix schema over builtins.fromJSON's already-parsed
      # value) must agree on every flake.lock-shaped fixture -- both
      # accept with byte-identical output, or both reject.
      - name: Verify packrat grammar and valuewalk schema agree
        run: ./verify-valuewalk-parity.sh

      # verify-roundtrip.sh: lib/generate.nix's output must be accepted
      # by the SAME grammar/schema it was generated for -- confirms the
      # generate/parse pair is a real fixpoint, not just that generation
      # runs without throwing.
      - name: Verify generated samples round-trip through their grammar
        run: ./verify-roundtrip.sh

      # default.nix / run.sh: the documented entry point actually works.
      - name: Run default.nix against data/lock.json
        run: ./run.sh

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22

      # nixfmt (RFC 166) is the standard formatter; --check exits non-zero
      # on any unformatted file without touching it.
      - name: Check nix formatting
        run: nix run nixpkgs#nixfmt -- --check $(find . -name '*.nix' -not -path './.claude/*')
